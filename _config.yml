# Setup
title: Colin Iuliano
tagline: Software Developer, Hardware Tinkerer
url: http://coliniuliano.com
# paginate: 0
baseurl: ""
permalink: pretty

# Assets
# We specify the directory for Jekyll so we can use @imports.
sass:
  sass_dir: _sass
  style: :compressed

# Gems
# plugins:
#   - jekyll-gist
#   - jekyll-paginate
#   - jekyll-seo-tag

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
# Custom exclude
  - bin

sass:
  sass_dir: _sass
  style: :compressed

# Custom configuration
ga_analytics: UA-129012824-1
excerpt_separator: "<!-- more -->"
collections:
  projects:
    output: true
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: "_projects"
    values:
      layout: "page-gallery"

# Custom vars
version: 3.0.0
