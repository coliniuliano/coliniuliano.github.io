# Setup
title: Colin Iuliano
tagline: Software Developer, Hardware Tinkerer
url: https://www.coliniuliano.ca
# paginate: 0
baseurl: ""
permalink: pretty

# Assets
# We specify the directory for Jekyll so we can use @imports.
sass:
  sass_dir: _sass
  style: :compressed

# Gems
# plugins:
#   - jekyll-gist
#   - jekyll-paginate
#   - jekyll-seo-tag

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
# Custom exclude
  - bin

# Custom configuration
ga_analytics: G-YZ4KD50JPT
excerpt_separator: "<!-- more -->"
collections:
  projects:
    output: true
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "_projects"
    values:
      layout: "page-gallery"

# Custom vars
version: 3.0.0
